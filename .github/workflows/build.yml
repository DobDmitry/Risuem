name: Сборка APK

# APK собирается при каждом пуше в main и по кнопке «Run workflow».
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Поставить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Подготовить Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Разрешить запуск gradlew
        run: chmod +x ./gradlew

      - name: Тесты математики (заливка, отмена, фото в раскраску, документ)
        run: ./gradlew :core:test --no-daemon

      # Ошибки компиляции печатаем ещё раз в самом конце шага:
      # иначе длинный стектрейс Gradle вытесняет их из хвоста лога.
      - name: Собрать debug APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tee build.log || {
            echo "::group::Ошибки компиляции"
            grep -E "^e: " build.log | head -80
            echo "::endgroup::"
            exit 1
          }

      - name: Назвать APK по номеру сборки
        run: cp app/build/outputs/apk/debug/app-debug.apk risuem-${{ github.run_number }}.apk

      - name: Отчёт тестов, если что-то упало
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_number }}
          path: core/build/reports/tests/test

      # Самым последним шагом — ещё раз только ошибки компиляции.
      # В хвосте лога их не перебивают ни стектрейс Gradle, ни выгрузка артефактов.
      - name: Ошибки компиляции, если сборка упала
        if: failure()
        run: |
          echo "── ошибки компиляции ──"
          grep -E "^e: " build.log | head -80 || echo "в логе нет строк с ошибками компиляции"

      - name: Выложить APK в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          files: risuem-${{ github.run_number }}.apk
          body: |
            «РИСУЕМ», сборка ${{ github.run_number }}.

            Скачайте файл `risuem-${{ github.run_number }}.apk` ниже и откройте его на телефоне.
            Если Android спросит разрешение на установку из этого источника — разрешите.
