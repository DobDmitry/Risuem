# Compose-компиляция прожорлива: на стандартных 2 ГБ сборка на сервере
# падает «ошибкой компиляции» при совершенно исправных исходниках.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m

org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
